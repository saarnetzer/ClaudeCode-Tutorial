name: Link Check

on:
  schedule:
    - cron: '0 6 * * 5'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links in site pages
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,201,204,206,301,302,308,429
            --exclude 'goatcounter\.com'
            --exclude 'gc\.zgo\.at'
            --exclude 'github\.com/saarnetzer/ClaudeCode-Tutorial/issues/new'
            --exclude-path node_modules
            './*.html'
          output: ./lychee-report.md
          fail: false
      - name: Open issue if links are broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🔗 בודק הקישורים מצא קישורים שבורים"
          content-filepath: ./lychee-report.md
          labels: bug, automated
